name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - run: bun install --frozen-lockfile
        env:
          ONNXRUNTIME_NODE_INSTALL: skip

      - run: bun run typecheck

      - run: bun run test

      - run: bun run check
